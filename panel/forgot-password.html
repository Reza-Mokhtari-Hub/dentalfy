<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فراموشی رمز | اکادمی دندان</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body class="panel-body">
  <div class="login-wrap">
    <div class="login-card" style="max-width:440px">
      <a href="index.html" style="font-size:0.85rem;color:var(--gray-500)">← بازگشت به ورود</a>
      <h1 style="margin-top:1rem">فراموشی رمز عبور</h1>
      <p class="subtitle" id="pageSubtitle">ایمیل خود را وارد کنید</p>

      <div id="stepEmail">
        <form id="emailForm">
          <div class="form-row">
            <label for="resetEmail">ایمیل ثبت‌شده</label>
            <input type="email" id="resetEmail" required dir="ltr" placeholder="email@example.com" />
          </div>
          <button type="submit" class="btn btn-primary btn-block">ادامه</button>
        </form>
      </div>

      <div id="stepAuthor" class="hidden">
        <p class="form-hint" style="margin-bottom:1rem">
          درخواست بازیابی برای <strong id="authorEmailLabel"></strong> ثبت می‌شود. مدیر (RMO) پس از بررسی رمز جدید به شما می‌دهد.
        </p>
        <button type="button" class="btn btn-primary btn-block" id="submitAuthorReset">ثبت درخواست بازیابی</button>
        <button type="button" class="btn btn-outline btn-block" id="backFromAuthor" style="margin-top:0.5rem">بازگشت</button>
      </div>

      <div id="stepDone" class="hidden">
        <p class="form-hint success" id="doneMessage"></p>
        <a href="index.html" class="btn btn-primary btn-block" style="margin-top:1rem;text-align:center">رفتن به ورود</a>
      </div>

      <p class="form-hint" id="resetFeedback" role="status"></p>

       <div class="login-hint" id="recoveryHint">
        <small>پس از بررسی رمز عبور جدید برای شما ارسال خواهد شد</small>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/crypto.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/post-status.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/api.js"></script>
  <script>
    let currentEmail = "";

    const stepEmail = document.getElementById("stepEmail");
    const stepAuthor = document.getElementById("stepAuthor");
    const stepAdmin = document.getElementById("stepAdmin");
    const stepDone = document.getElementById("stepDone");
    const fb = document.getElementById("resetFeedback");

    function showStep(step) {
      [stepEmail, stepAuthor, stepAdmin, stepDone].forEach((el) => el.classList.add("hidden"));
      step.classList.remove("hidden");
      fb.textContent = "";
      fb.className = "form-hint";
    }

    document.getElementById("emailForm").addEventListener("submit", (e) => {
      e.preventDefault();
      currentEmail = document.getElementById("resetEmail").value.trim();
      if (!currentEmail) return;

      if (Api.isAdminEmail(currentEmail)) {
        document.getElementById("adminEmailHidden").value = currentEmail;
        document.getElementById("pageSubtitle").textContent = "بازیابی حساب مدیر";
        showStep(stepAdmin);
      } else {
        const userExists = Store.getUsers().some(
          (u) => u.email.toLowerCase() === currentEmail.toLowerCase() && u.role === ROLES.AUTHOR
        );
        if (!userExists) {
          fb.className = "form-hint error";
          fb.textContent = "ایمیل نویسنده در سیستم یافت نشد.";
          return;
        }
        document.getElementById("authorEmailLabel").textContent = currentEmail;
        document.getElementById("pageSubtitle").textContent = "درخواست بازیابی نویسنده";
        showStep(stepAuthor);
      }
    });

    document.getElementById("submitAuthorReset").addEventListener("click", () => {
      const result = Api.requestPasswordReset(currentEmail);
      if (!result.ok) {
        fb.className = "form-hint error";
        fb.textContent = result.error;
        if (result.isAdmin) showStep(stepAdmin);
        return;
      }
      document.getElementById("doneMessage").textContent =
        "درخواست شما ثبت شد. پس از تأیید مدیر، رمز جدید به شما داده می‌شود.";
      document.getElementById("recoveryHint").classList.add("hidden");
      showStep(stepDone);
    });

    document.getElementById("adminRecoverForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const result = await Api.recoverAdminPassword({
        email: document.getElementById("adminEmailHidden").value,
        recoveryKey: document.getElementById("recoveryKey").value,
        newPassword: document.getElementById("newPass").value,
        confirmPassword: document.getElementById("newPass2").value,
      });
      if (!result.ok) {
        fb.className = "form-hint error";
        fb.textContent = result.error;
        return;
      }
      document.getElementById("doneMessage").textContent =
        "رمز مدیر با موفقیت تغییر کرد. اکنون وارد شوید.";
      document.getElementById("recoveryHint").classList.add("hidden");
      showStep(stepDone);
    });

    document.getElementById("backFromAuthor").addEventListener("click", () => showStep(stepEmail));
    document.getElementById("backFromAdmin").addEventListener("click", () => showStep(stepEmail));
  </script>
</body>
</html>
