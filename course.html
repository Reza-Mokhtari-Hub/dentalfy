<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>درس | اکادمی دندان</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="css/content.css" />
  <script>
    (function() {
      const t = localStorage.getItem("dental_theme");
      if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>
  <header class="header">
    <nav class="nav container">
      <a href="index.html" class="logo">
        <img src="assets/images/logo.png" alt="لوگوی دنتالفای" class="logo-img" />
        <span class="logo-text"><span data-site-name>اکادمی</span> <strong data-site-name-bold>دندان</strong></span>
      </a>
      <a href="index.html#courses" class="btn btn-outline btn-sm">← همه دروس</a>
    </nav>
  </header>

  <main class="course-page" id="courseMain">
    <p class="container loading-state">در حال بارگذاری...</p>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p class="footer-powered">Powered by <strong data-powered-by>RMO</strong></p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/media-store.js"></script>
  <script src="js/post-status.js"></script>
  <script src="js/author-display.js"></script>
  <script src="js/content.js"></script>
  <script src="js/courses.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/site.js"></script>
  <script src="js/course-page.js"></script>
</body>
</html>
